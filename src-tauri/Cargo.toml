[package]
name = "lanshan"
version = "0.1.0"
description = "览山 — a calm Windows file manager"
edition = "2021"
[lib]
name = "lanshan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
[dependencies]
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
# Tauri 2.11 uses Option-returning monitor APIs. Keep its runtime family aligned;
# a broad transitive ^2 requirement otherwise selects incompatible 2.12 runtimes.
tauri-runtime = "=2.11.3"
tauri-runtime-wry = { version = "=2.11.4", default-features = false }
tauri-macros = "=2.6.3"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
serde = { version = "1", features = ["derive"] }
